{% extends "base.html" %}

{% block title %}Password changed | Zen Restaurant{% endblock title %}

{% block content %}
<section class="bg-gray-50 py-16">
  <div class="mx-auto w-full max-w-md px-4">
    <div class="rounded-xl bg-white p-8 text-center shadow-sm ring-1 ring-gray-200">

      <!-- Success icon -->
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-green-50">
        <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h1 class="mt-4 text-2xl font-bold text-gray-900">Password changed</h1>
      <p class="mt-2 text-sm text-gray-600">Your password has been reset. You can now log in with your new password.</p>

      <a href="{% url 'login-page' %}"
        class="mt-6 inline-block w-full rounded-lg bg-amber-500 px-4 py-2.5 text-sm font-semibold text-gray-900 transition duration-200 hover:bg-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">
        Log in
      </a>

    </div>
  </div>
</section>
{% endblock content %}
