<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Zen Restaurant {% endblock title %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <nav class="bg-gray-800 p-4">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <!-- Logo / Brand -->
        <a href="/" class="text-white text-xl font-bold tracking-wider"
          >Zen Restaurant</a
        >

        <!-- Navigation Links -->
        <div class="hidden md:flex space-x-6">
          <a
            href="/"
            class="text-gray-300 hover:text-white transition duration-200"
            >Home</a
          >
          <a
            href="{% url 'menu' %}"
            class="text-gray-300 hover:text-white transition duration-200"
            >Menu</a
          >
          <a
            href="{% url 'about' %}"
            class="text-gray-300 hover:text-white transition duration-200"
            >About</a
          >
          <a
            href="/gallery/"
            class="text-gray-300 hover:text-white transition duration-200"
            >Gallery</a
          >
          <a
            href="/contact/"
            class="text-gray-300 hover:text-white transition duration-200"
            >Contact</a
          >
        </div>

        <!-- Call to Action Button -->
        <div class="hidden md:block">
          <a
            href="/reserve/"
            class="bg-amber-500 text-gray-900 font-semibold px-4 py-2 rounded-lg hover:bg-amber-400 transition duration-200"
            >Reserve a Table</a
          >
        </div>

        <!-- Mobile Menu Button (Hamburger) -->
        <div class="md:hidden flex items-center">
          <button
            id="menu-btn"
            aria-label="Toggle menu"
            aria-expanded="false"
            class="text-gray-300 hover:text-white focus:outline-none"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
        <a href="/" class="block text-gray-300 hover:text-white">Home</a>
        <a href="/menu/" class="block text-gray-300 hover:text-white">Menu</a>
        <a href="/about/" class="block text-gray-300 hover:text-white">About</a>
        <a href="/gallery/" class="block text-gray-300 hover:text-white"
          >Gallery</a
        >
        <a href="/contact/" class="block text-gray-300 hover:text-white"
          >Contact</a
        >
        <a
          href="/reserve/"
          class="block bg-amber-500 text-gray-900 font-semibold text-center px-4 py-2 rounded-lg hover:bg-amber-400"
          >Reserve a Table</a
        >
      </div>
    </nav>

    {% block content %}
    <h1>hello i am sophia</h1>
    {% endblock content %}

    <script>
      const btn = document.getElementById("menu-btn");
      const menu = document.getElementById("mobile-menu");
      btn.addEventListener("click", () => {
        const open = menu.classList.toggle("hidden") === false;
        btn.setAttribute("aria-expanded", open);
      });
    </script>
  </body>
</html>
